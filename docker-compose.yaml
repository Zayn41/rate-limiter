services:
    redis:
        image: redis:7-alpine
        container_name: ratelimit-redis
        restart: unless-stopped
        ports:
           - "6379:6379"
        command: >
            redis-server
            --appendonly yes
            --requirepass ${REDIS_PASSWORD}
            --maxmemory 256mb
            --maxmemory-policy allkeys-lru
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3